{% load leaflet_tags %}
<!DOCTYPE html>
<style>
  .leaflet-container {
    /* all maps */
    width: 100%;
    height: 100%;
  }

  /* Resize the "display_raw" textbox */

    width: 100%;

</style>
<html>

<head>
  {% leaflet_js %}
  {% leaflet_css %}
  <title>Interactive maps for Django web apps</title>
</head>

<body>
  <h1>Weather or Not?!</h1>
  {% leaflet_map "yourmap" %}
</body>

</html>
